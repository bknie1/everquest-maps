<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emoda Maps Preview</title>
<style>
  :root { --parchment: #e8d9b9; --ink: #3a2f1e; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 Georgia, serif; color: var(--ink); background: #2b2723; display: flex; height: 100vh; }
  #side { width: 240px; background: #241f1a; color: #d8c9a5; display: flex; flex-direction: column; border-right: 2px solid #10100c; }
  #side header { padding: 10px 12px 6px; }
  #side h1 { font-size: 16px; margin: 0 0 8px; letter-spacing: 1px; }
  #side input[type=file] { display: none; }
  .btn { display: block; width: 100%; padding: 7px; background: #6d5a35; color: #f4e9cd; border: 1px solid #10100c; cursor: pointer; font: inherit; text-align: center; }
  .btn:hover { background: #85703f; }
  .btn.sub { background: transparent; color: #9c8a63; border-color: #443a2b; margin-top: 6px; font-size: 12px; padding: 5px; }
  .btn.sub:hover { background: #2c251c; color: #d8c9a5; }
  #filter { width: 100%; margin-top: 8px; padding: 5px 7px; background: #17130f; color: #d8c9a5; border: 1px solid #443a2b; font: inherit; }
  #zones { flex: 1; overflow-y: auto; margin: 8px 0 0; padding: 0; list-style: none; }
  #zones li { padding: 4px 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #zones li:hover { background: #382f24; }
  #zones li.sel { background: #6d5a35; color: #fff; }
  #layers { padding: 8px 12px; border-top: 1px solid #443a2b; font-size: 13px; }
  #layers label { margin-right: 8px; user-select: none; }
  #main { flex: 1; position: relative; overflow: hidden; }
  #cv { position: absolute; inset: 0; cursor: grab; }
  #hint { position: absolute; top: 40%; width: 100%; text-align: center; color: #8d8065; font-size: 18px; pointer-events: none; }
  #status { position: absolute; bottom: 0; left: 0; right: 0; padding: 3px 10px; background: rgba(20,17,13,.8); color: #b7a985; font-size: 12px; }
</style>
</head>
<body>
<div id="side">
  <header>
    <h1>Emoda Maps</h1>
    <input id="filter" placeholder="filter zones" disabled>
    <button class="btn sub" id="openBtn">Load a local folder instead&hellip;</button>
    <input type="file" id="dir" webkitdirectory multiple>
  </header>
  <ul id="zones"></ul>
  <div id="layers">
    <label><input type="checkbox" data-l="0" checked> base</label><label><input type="checkbox" data-l="1" checked> POI</label><br>
    <label><input type="checkbox" data-l="2" checked> deco</label><br>
    <label><input type="checkbox" data-l="3" checked> Historical POI &amp; Zones</label><br>
    <label><input type="checkbox" id="lbl" checked> labels</label>
    <div id="zbox" style="margin-top:8px; border-top:1px solid #443a2b; padding-top:8px;">
      <label><input type="checkbox" id="zon"> filter by height (z)</label>
      <div id="zctl" style="display:none; margin-top:6px;">
        <div id="zval" style="font-size:12px; color:#b7a985;"></div>
        <div style="font-size:11px; color:#9c8a63;">from (floor)</div>
        <input type="range" id="zmin" step="1" style="width:100%; margin:2px 0;">
        <div style="font-size:11px; color:#9c8a63;">to (ceiling)</div>
        <input type="range" id="zmax" step="1" style="width:100%; margin:2px 0;">
      </div>
    </div>
  </div>
</div>
<div id="main">
  <canvas id="cv"></canvas>
  <div id="hint">Loading the atlas&hellip;</div>
  <div id="coords" style="position:absolute; top:6px; left:8px; padding:3px 8px; background:rgba(20,17,13,.8); color:#d8c9a5; font-size:12px; border-radius:3px; display:none; pointer-events:none; font-family:monospace;"></div>
  <div id="status"></div>
</div>
<script>
"use strict";
// A layer source is either a File (local folder) or a URL string (repo/hosted).
const files = new Map();      // zone -> {0:src,1:src,2:src,3:src}
const cache = new Map();      // zone -> parsed layers
let current = null, view = { x: 0, y: 0, k: 1 };
let zEnabled = false, zMinV = 0, zMaxV = 0, zZone = null;

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const zonesEl = document.getElementById("zones"), statusEl = document.getElementById("status");
const hintEl = document.getElementById("hint");

document.getElementById("openBtn").onclick = () => document.getElementById("dir").click();
document.getElementById("dir").onchange = e => {
  files.clear(); cache.clear(); current = null;
  for (const f of e.target.files) {
    const m = /^([^\/\\]+?)(?:_([123]))?\.txt$/.exec(f.name);
    if (!m) continue;
    if (!files.has(m[1])) files.set(m[1], {});
    files.get(m[1])[m[2] || "0"] = f;
  }
  buildList();
  document.getElementById("filter").disabled = files.size === 0;
  hintEl.style.display = files.size ? "none" : "";
  status(files.size + " zones loaded from folder");
  autoSelect();
};

// Auto-load the maps that ship in this repo, so the hosted page is a live
// view of current map progress. Falls back silently when opened as a local
// file (no server) or when the manifest is absent.
async function loadFromRepo() {
  let man;
  try {
    const res = await fetch("maps-manifest.json", { cache: "no-cache" });
    if (!res.ok) return false;
    man = await res.json();
  } catch (_) { return false; }
  files.clear(); cache.clear();
  const folder = man.folder;
  for (const [zone, layers] of Object.entries(man.zones)) {
    const entry = {};
    for (const k of layers) {
      const suffix = k === "0" ? "" : "_" + k;
      entry[k] = encodeURI(folder + "/" + zone + suffix + ".txt");
    }
    files.set(zone, entry);
  }
  return files.size > 0;
}

function buildList() {
  const q = document.getElementById("filter").value.toLowerCase();
  zonesEl.innerHTML = "";
  [...files.keys()].sort().forEach(z => {
    if (q && !z.includes(q)) return;
    const li = document.createElement("li");
    li.textContent = z;
    li.className = z === current ? "sel" : "";
    li.onclick = () => select(z);
    zonesEl.appendChild(li);
  });
}
document.getElementById("filter").oninput = buildList;

function autoSelect() {
  if (current || files.size === 0) return;
  const prefer = ["unrest", "newsebexp", "ecommons", "qeynos", "freporte"];
  const pick = prefer.find(z => files.has(z)) || [...files.keys()].sort()[0];
  select(pick);
}

async function layerText(src) {
  if (typeof src === "string") {
    const res = await fetch(src, { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    return res.text();
  }
  return src.text();
}

async function parseZone(z) {
  if (cache.has(z)) return cache.get(z);
  const layers = {};
  for (const [k, src] of Object.entries(files.get(z))) {
    const lines = [], points = [];
    let raw;
    try { raw = await layerText(src); } catch (_) { layers[k] = { lines, points }; continue; }
    for (const line of raw.split("\n")) {
      const t = line.trim();
      if (t[0] === "L") {
        const p = t.slice(1).split(",");
        if (p.length >= 9) lines.push([+p[0], +p[1], +p[3], +p[4], `rgb(${+p[6]},${+p[7]},${+p[8]})`, (+p[2] + +p[5]) / 2]);
      } else if (t[0] === "P") {
        const p = t.slice(1).split(",");
        if (p.length >= 8) points.push([+p[0], +p[1], `rgb(${+p[3]},${+p[4]},${+p[5]})`, p.slice(7).join(",").replace(/_/g, " ").trim(), +p[2]]);
      }
    }
    layers[k] = { lines, points };
  }
  cache.set(z, layers);
  return layers;
}

function activeLayers() {
  return [...document.querySelectorAll("#layers input[data-l]")].filter(c => c.checked).map(c => c.dataset.l);
}

async function select(z) {
  current = z;
  hintEl.style.display = "none";
  buildList();
  status("loading " + z + "…");
  await fit();
}

function computeZBounds(layers) {
  let lo = 1e9, hi = -1e9;
  for (const L of Object.values(layers)) {
    for (const ln of L.lines) { const z = ln[5]; if (z < lo) lo = z; if (z > hi) hi = z; }
    for (const pt of L.points) { const z = pt[4]; if (z < lo) lo = z; if (z > hi) hi = z; }
  }
  if (lo > hi) { lo = 0; hi = 0; }
  lo = Math.floor(lo); hi = Math.ceil(hi);
  const zmin = document.getElementById("zmin"), zmax = document.getElementById("zmax");
  zmin.min = zmax.min = lo; zmin.max = zmax.max = hi;
  document.getElementById("zon").disabled = (hi - lo) < 1;
  if (current !== zZone) {                 // new zone: reset the range to full
    zZone = current;
    zmin.value = lo; zmax.value = hi;
    zMinV = lo; zMaxV = hi;
    document.getElementById("zval").textContent = "z " + lo + " … " + hi;
  }
}

async function fit() {
  if (!current) return;
  const layers = await parseZone(current);
  computeZBounds(layers);
  let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
  for (const k of activeLayers()) {
    const L = layers[k]; if (!L) continue;
    for (const [x1, y1, x2, y2] of L.lines) {
      minx = Math.min(minx, x1, x2); maxx = Math.max(maxx, x1, x2);
      miny = Math.min(miny, y1, y2); maxy = Math.max(maxy, y1, y2);
    }
    for (const [x, y] of L.points) {
      minx = Math.min(minx, x); maxx = Math.max(maxx, x);
      miny = Math.min(miny, y); maxy = Math.max(maxy, y);
    }
  }
  if (minx > maxx) return draw();
  const pad = 30;
  view.k = Math.min((cv.width - 2 * pad) / (maxx - minx || 1), (cv.height - 2 * pad) / (maxy - miny || 1));
  view.x = (cv.width - (maxx + minx) * view.k) / 2;
  view.y = (cv.height - (maxy + miny) * view.k) / 2;
  draw();
}

async function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = getComputedStyle(document.body).getPropertyValue("--parchment");
  ctx.fillRect(0, 0, cv.width, cv.height);
  if (!current) return;
  const layers = await parseZone(current);
  ctx.setTransform(view.k, 0, 0, view.k, view.x, view.y);
  ctx.lineWidth = 1 / view.k;
  const showLbl = document.getElementById("lbl").checked;
  for (const k of activeLayers()) {
    const L = layers[k]; if (!L) continue;
    let last = null;
    for (const [x1, y1, x2, y2, c, z] of L.lines) {
      if (zEnabled && (z < zMinV || z > zMaxV)) continue;
      if (c !== last) { if (last !== null) ctx.stroke(); ctx.beginPath(); ctx.strokeStyle = c; last = c; }
      ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    }
    if (last !== null) ctx.stroke();
    const r = 3 / view.k;
    ctx.font = `${12 / view.k}px Georgia`;
    for (const [x, y, c, label, z] of L.points) {
      if (zEnabled && (z < zMinV || z > zMaxV)) continue;
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
      if (showLbl && label) ctx.fillText(label, x + r * 1.6, y - r * 0.6);
    }
  }
  status(current + "  ·  zoom " + view.k.toFixed(2) + "x");
}

function status(s) { statusEl.textContent = s; }

function resize() {
  cv.width = cv.parentElement.clientWidth;
  cv.height = cv.parentElement.clientHeight;
  draw();
}
window.onresize = resize;

let dragging = null;
cv.onmousedown = e => { dragging = { x: e.clientX - view.x, y: e.clientY - view.y }; cv.style.cursor = "grabbing"; };
window.onmousemove = e => { if (dragging) { view.x = e.clientX - dragging.x; view.y = e.clientY - dragging.y; draw(); } };
window.onmouseup = () => { dragging = null; cv.style.cursor = "grab"; };
cv.ondblclick = fit;
cv.onwheel = e => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  view.x = e.offsetX - (e.offsetX - view.x) * f;
  view.y = e.offsetY - (e.offsetY - view.y) * f;
  view.k *= f;
  draw();
};
const coordsEl = document.getElementById("coords");
cv.addEventListener("mousemove", e => {
  const rect = cv.getBoundingClientRect();
  const wx = (e.clientX - rect.left - view.x) / view.k;
  const wy = (e.clientY - rect.top - view.y) / view.k;
  // game /loc is the inverse of the native transform: native = (-b, -a)
  coordsEl.style.display = "";
  coordsEl.textContent = `/loc ${(-wy).toFixed(1)}, ${(-wx).toFixed(1)}   ·   xy ${wx.toFixed(1)}, ${wy.toFixed(1)}`;
});
cv.addEventListener("mouseleave", () => { coordsEl.style.display = "none"; });

document.querySelectorAll("#layers input[data-l], #lbl").forEach(c => c.onchange = draw);
document.getElementById("zon").onchange = e => {
  zEnabled = e.target.checked;
  document.getElementById("zctl").style.display = zEnabled ? "" : "none";
  draw();
};
(function () {
  const zmin = document.getElementById("zmin"), zmax = document.getElementById("zmax");
  function onZ() {
    zMinV = Math.min(+zmin.value, +zmax.value);
    zMaxV = Math.max(+zmin.value, +zmax.value);
    document.getElementById("zval").textContent = "z " + zMinV + " … " + zMaxV;
    draw();
  }
  zmin.oninput = onZ; zmax.oninput = onZ;
})();

async function init() {
  resize();
  const ok = await loadFromRepo();
  if (ok) {
    document.getElementById("filter").disabled = false;
    buildList();
    status(files.size + " zones · live from the repo");
    autoSelect();
  } else {
    hintEl.innerHTML = "Click <b>Load a local folder</b> and pick your <b>Emoda Legends Maps</b> folder.<br><small>Drag to pan &middot; wheel to zoom &middot; double-click to fit</small>";
  }
}
init();
</script>
</body>
</html>
