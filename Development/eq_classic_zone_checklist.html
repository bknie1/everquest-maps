<meta charset="utf-8">
<title>EQ Classic — Old World Atlas Checklist</title>
<style>
  :root{
    --paper:#ece3cf; --paper2:#e4d9c0; --ink:#3a3226; --faint:#8a7c62;
    --line:#c9bb9c; --orange:#a4552a; --green:#4f7a3a; --gold:#b78a34;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:Georgia,'Iowan Old Style',serif;line-height:1.4;padding:22px 16px 60px}
  .wrap{max-width:940px;margin:0 auto}
  h1{font-size:26px;letter-spacing:2px;margin:0 0 2px;text-align:center}
  .sub{text-align:center;color:var(--faint);font-size:13px;font-style:italic;margin-bottom:18px}
  .overall{background:var(--paper2);border:1px solid var(--line);border-radius:8px;
    padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .bignum{font-size:34px;font-weight:bold;color:var(--orange);line-height:1}
  .bar{flex:1;min-width:200px;height:14px;background:#d8cbac;border:1px solid var(--line);
    border-radius:7px;overflow:hidden}
  .bar > span{display:block;height:100%;background:linear-gradient(90deg,#b8703a,#a4552a)}
  .filters{display:flex;gap:8px;margin-left:auto}
  .filters button{font-family:inherit;font-size:12px;padding:5px 12px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink);border-radius:20px;cursor:pointer}
  .filters button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .cont{margin-bottom:14px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper2)}
  .chead{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#dccdaf;
    border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
  .chead h2{font-size:17px;margin:0;letter-spacing:1px;flex:1}
  .cbar{width:120px;height:9px;background:#cbbd9d;border-radius:5px;overflow:hidden}
  .cbar > span{display:block;height:100%;background:var(--green)}
  .ccount{font-size:12px;color:var(--faint);width:52px;text-align:right}
  .rows{padding:4px 0}
  .row{display:flex;align-items:center;gap:11px;padding:6px 16px;border-bottom:1px solid #ddd0b4}
  .row:last-child{border-bottom:none}
  .row label{display:flex;align-items:center;gap:11px;cursor:pointer;flex:1}
  .box{width:19px;height:19px;border:2px solid var(--faint);border-radius:4px;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:var(--paper)}
  .row.done .box{background:var(--green);border-color:var(--green)}
  .row.done .box::after{content:'\2713'}
  .zname{font-size:15px;flex:1}
  .row.done .zname{color:var(--faint);text-decoration:line-through;text-decoration-color:#b6a988}
  .meta{font-size:11px;color:var(--faint);font-variant:small-caps;letter-spacing:.5px}
  .tag{font-size:9.5px;padding:1px 6px;border-radius:9px;border:1px solid var(--line);color:var(--faint);white-space:nowrap}
  .tag.after{border-color:var(--gold);color:var(--gold)}
  .tag.eql{border-color:var(--orange);color:var(--orange)}
  .tag.kun{border-color:#7a6a9a;color:#7a6a9a}
  .legend{font-size:11px;color:var(--faint);margin-top:10px;text-align:center;font-style:italic}
  .reset{display:block;margin:22px auto 0;font-family:inherit;font-size:11px;color:var(--faint);
    background:none;border:none;text-decoration:underline;cursor:pointer}
  .hide{display:none}
</style>
<div class="wrap">
  <h1>THE OLD WORLD</h1>
  <div class="sub">EverQuest Classic (pre-Kunark) — atlas completion checklist</div>

  <div class="overall">
    <div class="bignum"><span id="odone">0</span><span style="font-size:18px;color:var(--faint)">/<span id="ototal">0</span></span></div>
    <div style="min-width:120px">
      <div style="font-size:12px;color:var(--faint);margin-bottom:4px">zones mapped</div>
      <div class="bar"><span id="obar" style="width:0%"></span></div>
    </div>
    <div class="filters">
      <button data-f="all" class="on">All</button>
      <button data-f="todo">Remaining</button>
      <button data-f="done">Done</button>
    </div>
  </div>

  <div id="list"></div>
  <div class="legend">
    <span class="tag after">after launch</span> added post-launch, pre-Kunark &nbsp;·&nbsp;
    <span class="tag eql">EQL</span> EQ Legends zone &nbsp;·&nbsp;
    <span class="tag kun">Kunark</span> bonus (not Old World) &nbsp;·&nbsp; click a continent header to collapse
  </div>
  <button class="reset" id="reset">reset to delivered state</button>
</div>
<script>
const DATA = {
 "Antonica":[
  ["Blackburrow","5-15","Dungeon",1],["Everfrost Peaks","1-45","Outdoors",1],
  ["The Feerrott","1-35","Outdoors",1],["Innothule Swamp","1-12","Outdoors",1],
  ["Lavastorm Mountains","10-35","Outdoors",1],["Neriak","1-105","City",1],
  ["Grobb","1-75","City",1],["Oggok","1-75","City",1],["Halas","1-75","City",1],
  ["Surefall Glade","1-75","City",1],["Clan Runnyeye","12-35","Dungeon",1],
  ["Solusek's Eye (Sol A)","25-45","Dungeon",1],["Nagafen's Lair (Sol B)","40-55","Dungeon",1],
  ["Caverns of Exile (Sol C)","—","Dungeon",1,"eql"],["Temple of Solusek Ro","12-30","Dungeon",1,"after"],
  ["Splitpaw Lair","15-42","Dungeon",1],
  ["Qeynos","1-75","City",1],["Qeynos Hills","1-10","Outdoors",1],["Qeynos Catacombs","1-35","Indoors",1],
  ["Freeport","1-95","City",1],["Freeport Sewers","5-25","Indoors",1],
  ["North Karana","8-40","Outdoors",1],["South Karana","15-35","Outdoors",1],
  ["East Karana","10-35","Outdoors",1],["West Karana","5-35","Outdoors",1],
  ["Lake Rathetear","15-25","Outdoors",1],["Rathe Mountains","1-35","Outdoors",1],
  ["Nektulos Forest","1-20","Outdoors",1],["East Commonlands","1-40","Outdoors",1],
  ["West Commonlands","1-40","Outdoors",1],["North Ro","1-20","Outdoors",1],
  ["South Ro","8-25","Outdoors",1],["Oasis of Marr","1-20","Outdoors",1],
  ["Kithicor Forest","10-40","Outdoors",1],["Misty Thicket","1-12","Outdoors",1],
  ["Gorge of King Xorbb","10-25","Outdoors",1],["Rivervale","1-75","City",1],
  ["Highpass Hold","12-20","Outdoors",1],["High Keep","20-30","Dungeon",1],
  ["Befallen","5-20","Dungeon",1],["Najena","20-35","Dungeon",1],
  ["Permafrost Keep","15-50","Dungeon",1],["Upper Guk","5-30","Dungeon",1],
  ["Lower Guk","30-50","Dungeon",1],["Cazic-Thule","30-55","Dungeon",1]
 ],
 "Faydwer":[
  ["Ak'Anon","1-75","City",1],["Butcherblock Mountains","1-15","Outdoors",1],
  ["Felwithe","1-95","City",1],["Greater Faydark","1-10","Outdoors",1],
  ["Kaladim","1-75","City",1],["Lesser Faydark","10-35","Outdoors",1],
  ["Steamfont Mountains","1-15","Outdoors",1],["Castle Mistmoore","18-40","Dungeon",1],
  ["Estate of Unrest","10-35","Dungeon",1],["Ocean of Tears","10-40","Outdoors",1],
  ["Crushbone","5-20","Dungeon",1],["Dagnor's Cauldron","12-20","Outdoors",1],
  ["Kedge Keep","35-50","Dungeon",1]
 ],
 "Odus":[
  ["Erudin","1-85","City",1],["Erud's Crossing","5-15","Outdoors",1],
  ["Toxxulia Forest","1-10","Outdoors",1],["Paineel","1-105","City",1,"after"],
  ["The Warrens","1-25","Dungeon",1,"after"],["Stonebrunt Mountains","20-45","Outdoors",1,"after"],
  ["Erudin Palace","1-85","City",1],["Kerra Isle","10-25","Outdoors",1,"after"],
  ["The Hole","35-60","Dungeon",1,"after"]
 ],
 "Outer Planes":[
  ["Plane of Fear","46-65","Raid",1],["Plane of Hate","46-65","Raid",1],
  ["Plane of Sky","46-65","Raid",1,"after"]
 ],
 "Kunark bonus (already done)":[
  ["New Sebilis","55-65","Dungeon",1,"kun"]
 ]
};
const TAGL={after:"after launch",eql:"EQL",kun:"Kunark"};
let state={}, filter="all";

function key(c,n){return (c+"|"+n).replace(/[^a-z0-9|]/gi,"_");}
function defaults(){let s={};for(const c in DATA)for(const z of DATA[c])s[key(c,z[0])]=!!z[3];return s;}

async function load(){
  state=defaults();
  try{const r=await window.storage.get("zonecheck_v1");
    if(r&&r.value){const saved=JSON.parse(r.value);for(const k in saved)if(k in state)state[k]=saved[k];}
  }catch(e){/* first run */}
  render();
}
async function save(){
  try{await window.storage.set("zonecheck_v1",JSON.stringify(state));}catch(e){console.log("save failed",e);}
}

function render(){
  const list=document.getElementById("list");list.innerHTML="";
  let gDone=0,gTot=0;
  for(const cont in DATA){
    const zones=DATA[cont];
    let cDone=zones.filter(z=>state[key(cont,z[0])]).length;
    const isBonus=cont.indexOf("bonus")>=0;
    if(!isBonus){gDone+=cDone;gTot+=zones.length;}
    const box=document.createElement("div");box.className="cont";
    const pct=Math.round(cDone/zones.length*100);
    box.innerHTML=`<div class="chead"><h2>${cont}</h2>
      <div class="cbar"><span style="width:${pct}%"></span></div>
      <div class="ccount">${cDone}/${zones.length}</div></div><div class="rows"></div>`;
    const rows=box.querySelector(".rows");
    for(const z of zones){
      const k=key(cont,z[0]),done=state[k];
      if(filter==="todo"&&done)continue;
      if(filter==="done"&&!done)continue;
      const tag=z[4]?`<span class="tag ${z[4]}">${TAGL[z[4]]}</span>`:"";
      const row=document.createElement("div");row.className="row"+(done?" done":"");
      row.innerHTML=`<label><span class="box"></span>
        <span class="zname">${z[0]}</span>
        <span class="meta">${z[2]} · ${z[1]}</span>${tag}</label>`;
      row.querySelector("label").addEventListener("click",(e)=>{
        e.preventDefault();state[k]=!state[k];save();render();
      });
      rows.appendChild(row);
    }
    if(rows.children.length===0)box.classList.add("hide");
    box.querySelector(".chead").addEventListener("click",()=>rows.classList.toggle("hide"));
    list.appendChild(box);
  }
  document.getElementById("odone").textContent=gDone;
  document.getElementById("ototal").textContent=gTot;
  document.getElementById("obar").style.width=Math.round(gDone/gTot*100)+"%";
}
document.querySelectorAll(".filters button").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");filter=b.dataset.f;render();
  });
});
document.getElementById("reset").addEventListener("click",async()=>{
  state=defaults();await save();render();
});
load();
</script>
