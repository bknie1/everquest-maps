name: wiki-sync
# Daily pull of zone lore/POI text from the EQL wiki into src/data/wiki/.
# Changes arrive as commits, so map-relevant wiki edits show up as diffs.
on:
  schedule:
    - cron: '17 9 * * *'   # daily, 09:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull wiki pages
        run: python src/tools/wiki_sync.py
      - name: Commit changes if any
        run: |
          git config user.name "wiki-sync"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/wiki
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "wiki-sync: daily EQL wiki refresh"
          git push
